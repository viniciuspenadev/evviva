server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # O EasyPanel encerra HTTPS; redirecionamentos ficam relativos ao domínio público.
    absolute_redirect off;

    # Domínio temporário de apresentação. Alterar ao lançar a versão definitiva.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml application/json;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Somente arquivos com hash recebem cache longo.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
